name: Sync master for Vercel Production

# Vercel Production Branch ist "master". Pushes auf "main" erzeugen sonst nur Vorschau.
# Dieser Workflow aktualisiert master mit, damit jeder main-Push live geht.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update master to match main
        run: |
          git push origin HEAD:master
